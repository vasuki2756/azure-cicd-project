#cloud-config
# Runs once on first boot of the VM. Installs Node.js 20, PM2 and Nginx,
# and makes Nginx forward port 80 to the Node app on port 3000.

package_update: true
packages:
  - nginx
  - curl
  - ca-certificates

write_files:
  - path: /etc/nginx/conf.d/webapp.conf
    permissions: "0644"
    content: |
      server {
        listen 80 default_server;
        server_name _;

        location / {
          proxy_pass http://127.0.0.1:3000;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
      }

runcmd:
  - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
  - apt-get install -y nodejs
  - npm install -g pm2
  - mkdir -p /home/azureuser/app
  - chown -R azureuser:azureuser /home/azureuser/app
  - rm -f /etc/nginx/sites-enabled/default
  - systemctl enable nginx
  - systemctl restart nginx
